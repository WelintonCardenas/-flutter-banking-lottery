<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25274a"/>
      <stop offset="1" stop-color="#0e0f1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="0.45" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </radialGradient>
    <linearGradient id="ticket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e7f2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <g transform="translate(-45 -45)"><!-- Ticket -->
  <g transform="rotate(-10 470 470)" filter="url(#shadow)">
    <path d="M348 230 h292 a24 24 0 0 1 24 24 v420
             l-28.3 24 l-28.3 -24 l-28.3 24 l-28.3 -24 l-28.3 24 l-28.3 -24
             l-28.3 24 l-28.3 -24 l-28.3 24 l-28.3 -24 l-28.3 24 l-28.3 -24
             v-420 a24 24 0 0 1 24 -24 z" fill="url(#ticket)" transform="translate(0 0)"/>
    <rect x="360" y="290" width="160" height="26" rx="13" fill="#25274a"/>
    <circle cx="392" cy="380" r="30" fill="#10b981"/>
    <circle cx="472" cy="380" r="30" fill="#10b981"/>
    <circle cx="552" cy="380" r="30" fill="#10b981"/>
    <rect x="360" y="460" width="270" height="20" rx="10" fill="#c3c8db"/>
    <rect x="360" y="510" width="200" height="20" rx="10" fill="#c3c8db"/>
    <rect x="360" y="560" width="240" height="20" rx="10" fill="#c3c8db"/>
  </g>

  <!-- Ball -->
  <g filter="url(#shadow)">
    <circle cx="650" cy="650" r="190" fill="url(#ball)"/>
  </g>
  <circle cx="650" cy="650" r="112" fill="#ffffff"/>
  <text x="650" y="652" text-anchor="middle" dominant-baseline="central"
        font-family="DejaVu Sans, Arial, sans-serif" font-weight="800" font-size="128"
        fill="#1c1d36" letter-spacing="-4">15</text>
  <ellipse cx="580" cy="535" rx="62" ry="30" fill="#ffffff" opacity="0.28" transform="rotate(-30 580 535)"/>
</g></svg>
